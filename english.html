<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字母配对大冒险｜大小写英文学习小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #74b9ff, #a29bfe);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: #2d3436;
      margin-bottom: 16px;
      font-size: 28px;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background-color: #f1f2f6;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 18px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #0984e3;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #0667b0;
    }

    /* 两个卡片区域 */
    .row-title {
      font-size: 20px;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    .card-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 14px;
      margin-bottom: 12px;
    }

    .card {
      height: 90px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      border: 3px solid #dfe6e9;
    }

    .card-upper {
      background-color: #ffeaa7;
      color: #2d3436;
    }

    .card-lower {
      background-color: #55efc4;
      color: #2d3436;
    }

    .card.selected {
      border-color: #d63031;
      transform: scale(1.05);
    }

    .card.match {
      visibility: hidden;
      pointer-events: none;
    }

    .tip {
      text-align: center;
      margin-top: 16px;
      font-size: 18px;
      color: #636e72;
      min-height: 24px;
    }

    .win-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .win-content {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
    }

    .win-content h2 {
      color: #00b894;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🔤 字母配对大冒险</h1>
    <div class="info-bar">
      <div>得分：<span id="score">0</span></div>
      <div>用时：<span id="time">0</span>秒</div>
      <button class="btn" id="restart">重新开局</button>
    </div>

    <div class="row-title">🔡 大写字母（黄色）</div>
    <div class="card-wrap" id="upperBox"></div>

    <div class="row-title">🔤 小写字母（绿色）</div>
    <div class="card-wrap" id="lowerBox"></div>

    <div class="tip" id="tip">点击一张大写卡片，再点击对应小写字母完成配对！</div>
  </div>

  <div class="win-modal" id="winModal">
    <div class="win-content">
      <h2>🎉 恭喜通关！</h2>
      <p>最终得分：<span id="finalScore"></span></p>
      <p>总用时：<span id="finalTime"></span>秒</p>
      <button class="btn" id="playAgain">再来一局</button>
    </div>
  </div>

  <script>
    // 26个英文字母
    const upperLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    const lowerLetters = "abcdefghijklmnopqrstuvwxyz".split('');

    let upperBox = document.getElementById('upperBox');
    let lowerBox = document.getElementById('lowerBox');
    let scoreDom = document.getElementById('score');
    let timeDom = document.getElementById('time');
    let tipDom = document.getElementById('tip');
    let winModal = document.getElementById('winModal');
    let finalScoreDom = document.getElementById('finalScore');
    let finalTimeDom = document.getElementById('finalTime');

    let selectedCard = null;
    let score = 0;
    let timer = null;
    let seconds = 0;
    let totalPairs = 6; // 一局字母对数

    // 随机取字母
    function getRandomLetters(count) {
      let selectedUpper = [];
      let cloneUpper = [...upperLetters];
      for (let i = 0; i < count; i++) {
        let randomIdx = Math.floor(Math.random() * cloneUpper.length);
        let charUpper = cloneUpper.splice(randomIdx, 1)[0];
        selectedUpper.push(charUpper);
      }
      // 小写数组打乱
      let selectedLower = [...selectedUpper].map(c => c.toLowerCase());
      selectedLower = shuffle(selectedLower);
      return { selectedUpper, selectedLower };
    }
    // 洗牌算法
    function shuffle(arr) {
      let temp = [...arr];
      for (let i = temp.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [temp[i], temp[j]] = [temp[j], temp[i]];
      }
      return temp;
    }

    function renderCards() {
      upperBox.innerHTML = '';
      lowerBox.innerHTML = '';
      let { selectedUpper, selectedLower } = getRandomLetters(totalPairs);

      // 渲染大写卡片
      selectedUpper.forEach(char => {
        let div = document.createElement('div');
        div.className = `card card-upper`;
        div.innerText = char;
        div.dataset.char = char.toLowerCase();
        div.dataset.type = 'upper';
        div.addEventListener('click', onCardClick);
        upperBox.appendChild(div);
      })
      // 渲染小写卡片
      selectedLower.forEach(char => {
        let div = document.createElement('div');
        div.className = `card card-lower`;
        div.innerText = char;
        div.dataset.char = char.toLowerCase();
        div.dataset.type = 'lower';
        div.addEventListener('click', onCardClick);
        lowerBox.appendChild(div);
      })
    }

    function onCardClick(e) {
      let card = e.target;
      if (card.classList.contains('match')) return;

      // 还没有选中卡片
      if (!selectedCard) {
        selectedCard = card;
        card.classList.add('selected');
        tipDom.innerText = `已选中：${card.innerText}，请找对应的字母`;
      } else {
        // 已经选中一张
        if (selectedCard === card) {
          selectedCard.classList.remove('selected');
          selectedCard = null;
          tipDom.innerText = "请重新选择卡片";
          return;
        }
        if (selectedCard.dataset.type === card.dataset.type) {
          tipDom.innerText = "❌ 不能选两个相同类型！请选一大一小";
          selectedCard.classList.remove('selected');
          selectedCard = null;
          return;
        }

        // 判断字母是否匹配
        if (selectedCard.dataset.char === card.dataset.char) {
          tipDom.innerText = "✅ 配对成功！";
          selectedCard.classList.add('match');
          card.classList.add('match');
          score += 10;
          scoreDom.innerText = score;
          checkWin();
        } else {
          tipDom.innerText = "❌ 字母不匹配，再试试！";
        }
        selectedCard.classList.remove('selected');
        selectedCard = null;
      }
    }

    function checkWin() {
      let remainCards = document.querySelectorAll('.card:not(.match)');
      if (remainCards.length === 0) {
        clearInterval(timer);
        setTimeout(() => {
          finalScoreDom.innerText = score;
          finalTimeDom.innerText = seconds;
          winModal.style.display = 'flex';
        }, 300);
      }
    }

    function startTimer() {
      clearInterval(timer);
      seconds = 0;
      timeDom.innerText = seconds;
      timer = setInterval(() => {
        seconds++;
        timeDom.innerText = seconds;
      }, 1000);
    }

    function resetGame() {
      score = 0;
      scoreDom.innerText = score;
      tipDom.innerText = "点击一张大写卡片，再点击对应小写字母完成配对！";
      selectedCard = null;
      winModal.style.display = 'none';
      renderCards();
      startTimer();
    }

    document.getElementById('restart').addEventListener('click', resetGame);
    document.getElementById('playAgain').addEventListener('click', resetGame);

    // 页面加载初始化
    resetGame();
  </script>
</body>

</html>
